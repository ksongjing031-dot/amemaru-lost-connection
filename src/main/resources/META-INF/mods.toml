modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Discordサーバー「あめまるさん」のためのRPG Mod。
大結晶の街コネリアと、20階の塔をめぐる物語。
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# プレイヤーのモーション（playerAnimator）。クライアントにだけ要る（サーバーには入れなくてよい）
[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="${player_anim_range}"
    ordering="NONE"
    side="CLIENT"
